<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalDesk Rule Builder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Rule builder controls">
        <div class="brand">
          <div class="brand-mark">SD</div>
          <div>
            <h1>SignalDesk</h1>
            <p>NSE buy rule builder</p>
          </div>
        </div>

        <section class="panel compact">
          <label for="ruleSelect">Saved rule</label>
          <select id="ruleSelect"></select>
          <input id="ruleNameInput" type="text" placeholder="Rule name" autocomplete="off" />
          <div class="button-row">
            <button id="saveRuleButton" type="button">Save</button>
            <button id="newRuleButton" type="button">New</button>
          </div>
        </section>

        <section class="panel compact">
          <label for="groupSelect">Stock group</label>
          <select id="groupSelect"></select>
        </section>

        <section class="panel compact">
          <label for="dateSelect">Signal date</label>
          <select id="dateSelect"></select>
        </section>

        <section class="panel compact">
          <label for="searchInput">Find stock</label>
          <input id="searchInput" type="search" placeholder="Search symbol or name" autocomplete="off" />
        </section>

        <section class="panel rule-config">
          <div class="section-title">
            <h2>Filter Library</h2>
          </div>
          <div id="filterLibrary"></div>
        </section>

        <section class="panel rule-config">
          <div class="section-title">
            <h2>Selected Filters</h2>
          </div>
          <div id="selectedFilters"></div>
        </section>

        <section class="panel compact">
          <label>Backtest setup</label>
          <div class="input-grid two-col">
            <label>From
              <input id="fromDateInput" type="date" />
            </label>
            <label>To
              <input id="toDateInput" type="date" />
            </label>
            <label>Top N
              <input id="topNInput" type="number" min="1" step="1" value="10" />
            </label>
            <label>Capital
              <input id="capitalInput" type="number" min="0" step="1000" value="10000" />
            </label>
            <label>Target %
              <input id="targetInput" type="number" min="0" step="0.5" value="5" />
            </label>
            <label>Stop %
              <input id="stopInput" type="number" min="0" step="0.5" value="5" />
            </label>
            <label>Max hold days
              <input id="maxHoldInput" type="number" min="1" max="30" step="1" value="5" />
            </label>
          </div>
          <button id="backtestButton" type="button">Backtest rule</button>
          <p id="statusText" class="helper-text">Connecting to SQLite...</p>
        </section>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Filters become rules</p>
            <h2 id="pageTitle">NSE Buy Rule Builder</h2>
          </div>
          <div class="market-clock">
            <span>Mode</span>
            <strong>Research</strong>
          </div>
        </header>

        <section class="metrics-grid" id="metricsGrid"></section>

        <section class="content-grid">
          <div class="recommendations">
            <div class="section-title">
              <h2>Stocks Passing Rule</h2>
              <span id="resultMeta"></span>
            </div>
            <div id="backtestSummary" class="backtest-summary"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Stock</th>
                    <th>Close</th>
                    <th>Volume</th>
                    <th>Vol/20D</th>
                    <th>Delivery %</th>
                    <th>Del/20D</th>
                    <th>3D %</th>
                    <th>OBV/20D</th>
                    <th>20D ADV</th>
                    <th>RSI</th>
                    <th>Next day</th>
                  </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
              </table>
            </div>
          </div>

          <aside class="details-panel">
            <div class="section-title">
              <h2 id="selectedTitle">Rule Meaning</h2>
            </div>
            <div id="ruleMeaning" class="stock-details"></div>
            <div id="chart" class="chart"></div>
            <div id="details" class="stock-details"></div>
          </aside>
        </section>
      </section>
    </main>

    <script src="./app.js?v=builder-7"></script>
  </body>
</html>
